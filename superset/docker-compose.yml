# Superset 6.1.0 with a Postgres metadata DB and an `examples` database the agent can query.
name: superset-ai-dock

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d examples"]
      interval: 3s
      retries: 30

  superset:
    build: .
    image: superset-ai-dock:6.1.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-yes}
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./init.sh:/app/init.sh:ro
    command: ["/bin/sh", "/app/init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health"]
      interval: 5s
      retries: 60

volumes:
  pgdata:
